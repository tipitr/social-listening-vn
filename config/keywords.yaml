home_loan:
  # Core — every term explicitly contains a property/housing word
  vietnamese:
    - vay mua nhà
    - vay nhà
    - mua nhà
    - vay mua căn hộ
    - vay căn hộ
    - vay mua chung cư
    - vay mua nhà đất
    - vay mua bất động sản
    - cho vay mua nhà
    - cho vay bất động sản
    - mua nhà trả góp
    - vay thế chấp nhà
    - vay thế chấp bất động sản
    - thế chấp sổ đỏ
    - thế chấp nhà ở

  # Interest rate — only terms tied to property lending
  interest_rate:
    - lãi suất vay mua nhà
    - lãi suất vay nhà
    - lãi suất mua nhà
    - lãi suất thế chấp
    - lãi suất vay bất động sản
    - lãi suất ưu đãi mua nhà
    - lãi suất cố định mua nhà
    - lãi suất thả nổi mua nhà

  # Credit & process — scoped to housing
  credit:
    - tín dụng bất động sản
    - hồ sơ vay mua nhà
    - điều kiện vay mua nhà
    - thủ tục vay mua nhà
    - xét duyệt vay mua nhà
    - giải ngân vay nhà
    - trả nợ vay nhà
    - dư nợ vay mua nhà

  # Promotions — scoped to property
  promotions:
    - ưu đãi vay mua nhà
    - gói vay ưu đãi mua nhà
    - khuyến mãi vay mua nhà
    - vay mua nhà lãi suất thấp
    - cố định lãi suất vay nhà
    - hỗ trợ lãi suất mua nhà

  # Forum-specific short terms — forum thread titles use abbreviated phrases
  # not used by news scraper; only loaded by forums.py
  forum_keywords:
    - mua nhà
    - bán nhà
    - lãi suất
    - căn hộ
    - chung cư
    - hỗ trợ lãi suất
    - thế chấp
    - sổ đỏ
    - sổ hồng
    - vay nhà
    - vay mua nhà
    - mua căn hộ
    - giá nhà
    - mua chung cư

  # Banks — full list synced from config/banks.yaml
  # NOT used for article matching; used by dashboard competitor intel
  banks:
    - Vietcombank
    - BIDV
    - Agribank
    - VietinBank
    - Techcombank
    - VPBank
    - MBBank
    - HDBank
    - ACB
    - SHB
    - VIB
    - TPBank
    - Sacombank
    - SeABank
    - OCB
    - Eximbank
    - PVcomBank
    - LPBank
    - BVBank
    - HSBC
    - Shinhan
    - Hong Leong Bank
    - Standard Chartered
    - UOB
    - Kasikorn Bank

  # Negative filter — exclude unrelated content
  negative_filter:
    # Property project / developer marketing (not home loan content)
    - mở bán dự án
    - ra mắt dự án
    - giới thiệu dự án
    - tiến độ dự án
    - bàn giao dự án
    - chủ đầu tư
    - đầu tư bất động sản
    - vay tiêu dùng
    - vay mua xe
    - vay du học
    - vay kinh doanh
    - vay vốn lưu động
    - vay thẻ tín dụng
    - vay online
    - vay nhanh
    - vay nóng
    - cho vay ngang hàng
    - vay cá nhân
    - vay tín chấp tiêu dùng
    - lãi suất tiết kiệm
    - lãi suất huy động
    - tiềm lực tài chính
    - chuyển đổi số
    - nhà ở xã hội
    - nhà ở thu nhập thấp
    - gói vay 4.6%
    - gói vay nhà ở xã hội
    - giải ngân nhà ở xã hội

    # Person-to-person property classifieds (the noise pattern observed
    # in OTOFUN's real-estate sub-forum). Real home-loan questions are
    # almost always from BUYERS, not sellers/landlords. These phrases are
    # strong seller-side markers; the small risk of catching a legitimate
    # post like "muốn bán nhà cũ vay mua nhà mới" is worth the cleanup.
    - bán nhà
    - bán chung cư
    - bán căn hộ
    - bán shophouse
    - bán biệt thự
    - bán gấp
    - cần bán
    - e bán
    - tôi bán
    - mình bán
    - chính chủ
    - miễn trung gian
    - cho thuê
    - phòng trọ

# ── Inbox (private Messenger DMs) ────────────────────────────────────────────
# Tuned for chat language, NOT the strict page-post filter. Real customers DM
# about "thế chấp" (mortgage) and "đáo thế chấp" (mortgage rollover) without
# always typing "mua nhà". A message is kept if it hits an `include` term and
# none of the `exclude` terms. `exclude` removes KBank VN's heavy card / savings
# / car-loan inbox noise so only genuine home-/property-loan chats remain.
inbox:
  include:
    - vay mua nhà
    - mua nhà
    - mua căn hộ
    - căn hộ
    - chung cư
    - bất động sản
    - bđs
    - vay thế chấp
    - thế chấp nhà
    - thế chấp bất động sản
    - thế chấp bđs
    - đáo thế chấp
    - khoản vay mua
    - vay mua căn hộ
    - vay mua bđs
    - vay mua đất
    - mua đất
    - sổ đỏ
    - sổ hồng
  exclude:
    - thế chấp thẻ
    - thế chấp sổ
    - sổ thế chấp
    - thế chấp tiết kiệm
    - thế chấp tiền gửi
    - vay mua xe
    - mua xe
    - dư nợ thẻ
    - làm thẻ
    - hủy thẻ
    - huỷ thẻ

  # Topics — the richer, inbox-specific buckets used for grouping + insight.
  # Claude assigns each message exactly ONE topic key. Edit freely: the key is
  # stored in the DB and the description is what Claude reads to decide.
  topics:
    rollover:    "Đáo thế chấp — refinance or roll over an EXISTING mortgage to a new bank/term"
    new_inquiry: "Wants a NEW home/property loan, asks to borrow, or requests a loan consultation"
    eligibility: "Qualification: income, documents, conditions — 'can I get approved?'"
    rates_fees:  "Questions about interest rate, fees, or loan cost"
    servicing:   "Existing loan servicing: making payments, the app, statements, early payoff"
    cross_sell:  "Insurance or other products tied to the mortgage"
    complaint:   "A problem, frustration, or negative experience"
    other:       "Home-loan related but none of the above"
